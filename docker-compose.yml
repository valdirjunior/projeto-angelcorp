services:
  db:
    image: postgres:16
    container_name: angeldesk-db
    restart: always

    environment:
      POSTGRES_USER: angeluser
      POSTGRES_PASSWORD: angelpass
      POSTGRES_DB: angeldesk

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

    networks:
      default:
        aliases:
          - db-service

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U angeluser -d angeldesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: angeldesk-backend
    restart: always

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST: db-service
      DB_PORT: 5432
      DB_USER: angeluser
      DB_PASSWORD: angelpass
      DB_NAME: angeldesk
      PORT: 3000

    expose:
      - "3000"

    networks:
      default:
        aliases:
          - backend-service

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend

    container_name: angeldesk-frontend
    restart: always

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"

volumes:
  postgres_data: