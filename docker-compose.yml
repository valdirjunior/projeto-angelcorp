services:
  db:
    image: postgres:16
    container_name: angeldesk-db
    restart: always
    environment:
      POSTGRES_USER: angeluser
      POSTGRES_PASSWORD: angelpass
      POSTGRES_DB: angeldesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
    container_name: angeldesk-backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: angeluser
      DB_PASSWORD: angelpass
      DB_NAME: angeldesk
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data: